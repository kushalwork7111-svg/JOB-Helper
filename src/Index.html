<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<style>
 :root{--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--bg:#F3F4F6;--accent:#1D4ED8}
 body{margin:0;font:14px/1.45 Arial,sans-serif;background:var(--bg);color:var(--ink)}
 header{background:#0F172A;color:#fff;padding:14px 16px;font-weight:bold}
 main{max-width:1100px;margin:0 auto;padding:16px}
 .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} input,select{padding:8px;border:1px solid var(--line);border-radius:8px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
 .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
 .score{font-weight:bold} .muted{color:var(--muted);font-size:12px}
 .plan{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0} .plan td,.plan th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top;word-break:break-word}
 details.card summary{cursor:pointer;font-weight:bold} .set{display:grid;grid-template-columns:minmax(160px,1fr) 2fr;gap:8px 12px;align-items:center;margin:8px 0}
 .set input,.set select{width:100%;box-sizing:border-box} .set h4{grid-column:1/-1;margin:10px 0 0} .err{color:#B91C1C;font-size:13px}
 @media (max-width:560px){.set{grid-template-columns:1fr}}
 .warn{background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:8px;font-size:13px}
 button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer} button.primary{background:var(--accent);color:#fff;border:0}
</style></head><body>
<header>Job Finder <span class="muted" style="color:#94A3B8">v<?= version ?></span></header>
<main>
 <details class="card" style="margin-bottom:12px" id="settingsBox" ontoggle="if(this.open&&!SETTINGS.length)loadSettings()">
  <summary>Settings</summary>
  <div class="muted">Where alerts go, what to look for and how jobs are scored. Changes apply from the next check (within 5 minutes).</div>
  <div class="set" id="setForm">Loading…</div>
  <div class="bar"><button class="primary" onclick="saveSet()">Save settings</button><button onclick="testMail()">Send me a test alert</button></div>
  <div id="setMsg"></div>
 </details>
 <section class="card" style="margin-bottom:12px">
  <b>My CV</b>
  <div class="muted">Upload your CV (Word, PDF or text, any layout). The app reads it and sets itself up from it. Nothing is saved until you click "Use this CV".</div>
  <div class="bar"><input type="file" id="cvfile" accept=".docx,.doc,.pdf,.txt,.rtf,.odt"><button onclick="uploadCv()">Read my CV</button></div>
  <div id="cvout"></div>
 </section>
 <div class="bar"><input id="q" placeholder="Search title or company" oninput="paint()"><select id="st" onchange="paint()"><option value="">All statuses</option><option>New</option><option>Shortlisted</option><option>Tailored</option><option>Applied</option></select></div>
 <div class="grid" id="grid">Loading…</div>
</main>
<script>
let JOBS=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){google.script.run.withSuccessHandler(j=>{JOBS=j;paint()}).getJobs()}
function paint(){const q=document.getElementById('q').value.toLowerCase(),st=document.getElementById('st').value;
 document.getElementById('grid').innerHTML=JOBS.filter(j=>(!q||(j.title+' '+j.company).toLowerCase().includes(q))&&(!st||j.status===st)).map(j=>
 '<div class="card"><div class="score">Fit '+j.score+'</div><b>'+esc(j.title)+'</b><div>'+esc(j.company)+' · '+esc(j.location)+'</div>'+
 '<div class="muted">'+esc(j.breakdown)+'</div><div class="muted">'+esc(j.exp)+' · '+esc(j.salary||'Salary not stated')+' · '+esc(j.status)+'</div>'+
 '<div class="bar"><button onclick="tailor(\''+j.id+'\')">Tailor my CV</button><button class="primary" onclick="apply(\''+j.id+'\')">Apply</button>'+
 (j.url?'<a href="'+esc(j.url)+'" target="_blank" rel="noopener">Posting</a>':'')+'</div></div>').join('')||'No jobs yet.'}
function tailor(id){const note=prompt('Anything to stress for this job? (optional)')||'';google.script.run.withSuccessHandler(()=>alert('Requested. The tailored CV arrives by email within a few minutes.')).requestTailor(id,note)}
function apply(id,ok){google.script.run.withSuccessHandler(r=>{
 if(r.open){window.open(r.open,'_blank');alert(r.note)}else if(r.needTailor){alert('Tailor your CV for this job first.')}
 else if(r.confirm){if(confirm(r.confirm))apply(id,true)}else if(r.sent){alert('Application sent.');load()}}).applyJob(id,!!ok)}
const MIME={docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',pdf:'application/pdf',txt:'text/plain',rtf:'application/rtf',odt:'application/vnd.oasis.opendocument.text'};
let CVDOC='';
function uploadCv(){const f=document.getElementById('cvfile').files[0],out=document.getElementById('cvout');
 if(!f){alert('Choose your CV file first.');return}
 if(f.size>10*1024*1024){alert('That file is over 10 MB.');return}
 out.textContent='Reading your CV…';
 const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(showCv)
  .withFailureHandler(e=>out.textContent='Could not read the CV: '+e.message)
  .importCv(f.name,MIME[f.name.split('.').pop().toLowerCase()]||f.type,String(r.result).split(',')[1]);
 r.readAsDataURL(f)}
function showCv(res){CVDOC=res.docId;const cv=res.cv;
 const jobs=cv.experience.map(e=>'<li>'+esc(e.role||'(title not found)')+' · '+esc(e.company||'(company not found)')+' <span class="muted">'+esc(e.start)+' – '+esc(e.end)+'</span></li>').join('');
 const rows=res.plan.map(p=>'<tr><td>'+esc(p.field)+'</td><td>'+esc(p.current||'—')+'</td><td>'+(p.change?'<b>'+esc(p.proposed)+'</b>':esc(p.current||'—')+' <span class="muted">(kept)</span>')+'</td></tr>').join('');
 document.getElementById('cvout').innerHTML=(cv.warnings.length?'<div class="warn">Please check: '+cv.warnings.map(esc).join('<br>')+'</div>':'')+
  '<p><b>Jobs found</b> ('+cv.totalYears+' years in total, internships not counted)</p><ul>'+jobs+'</ul>'+
  '<table class="plan"><tr><th>Setting</th><th>Now</th><th>After</th></tr>'+rows+'</table>'+
  '<div class="bar"><button class="primary" onclick="useCv()">Use this CV</button><button onclick="document.getElementById(\'cvout\').innerHTML=\'\'">Cancel</button></div>'}
function useCv(){if(!confirm('Save these details to your Job Finder settings?'))return;
 google.script.run.withSuccessHandler(r=>{document.getElementById('cvout').innerHTML='Saved. '+r.changed.length+' settings updated. You can edit any of them in the Profile and Config tabs.'}).applyCv(CVDOC)}
let SETTINGS=[];
function loadSettings(){google.script.run.withSuccessHandler(list=>{SETTINGS=list;let g='';
 document.getElementById('setForm').innerHTML=list.map((s,i)=>{const head=s.group!==g?'<h4>'+esc(g=s.group)+'</h4>':'';
  const input=s.type==='yesno'?'<select id="set'+i+'"><option'+(s.value==='NO'?' selected':'')+' value="NO">No</option><option'+(s.value==='YES'?' selected':'')+' value="YES">Yes</option></select>'
   :'<input id="set'+i+'" value="'+esc(s.value)+'" '+(s.type==='number'?'inputmode="decimal"':s.type==='emails'?'type="email" multiple':'')+(s.help?' placeholder="'+esc(s.help)+'"':'')+'>';
  return head+'<label for="set'+i+'">'+esc(s.label)+'</label>'+input}).join('')}).getSettings()}
function saveSet(){const ch={};SETTINGS.forEach((s,i)=>{const v=document.getElementById('set'+i).value;if(v!==String(s.value))ch[s.key]=v});
 const msg=document.getElementById('setMsg');if(!Object.keys(ch).length){msg.textContent='Nothing changed.';return}
 if(!confirm('Save '+Object.keys(ch).length+' changed setting(s)?'))return;
 google.script.run.withSuccessHandler(r=>{if(r.ok){msg.innerHTML='Saved: '+r.saved.map(esc).join(', ');SETTINGS=[];loadSettings()}
  else msg.innerHTML='<div class="err">Not saved:<br>'+r.errors.map(esc).join('<br>')+'</div>'}).saveSettings(ch)}
function testMail(){if(!confirm('Send one test email to your alert address?'))return;
 google.script.run.withSuccessHandler(to=>document.getElementById('setMsg').textContent='Test email sent to '+to+'.')
  .withFailureHandler(e=>document.getElementById('setMsg').innerHTML='<div class="err">'+esc(e.message)+'</div>').sendTestAlert()}
load();
</script></body></html>
