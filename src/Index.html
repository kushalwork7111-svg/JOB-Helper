<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--card:#fff;--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E8F0;--soft:#F8FAFC;
 --accent:#4F46E5;--accent2:#4338CA;--accentSoft:#EEF2FF;--good:#059669;--goodSoft:#ECFDF5;--warn:#B45309;--warnSoft:#FFFBEB;
 --bad:#DC2626;--badSoft:#FEF2F2;--stretch:#64748B;--stretchSoft:#F1F5F9;--r:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.25} h1{font-size:22px;font-weight:700} h2{font-size:16px;font-weight:600} h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px} .hidden{display:none!important}
input,select,textarea{font:inherit;color:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accentSoft);border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-weight:500;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--soft);text-decoration:none} .btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent2)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--soft)}
.btn.icon{padding:7px;width:34px;height:34px} .btn.good{color:var(--good);border-color:#A7F3D0;background:var(--goodSoft)}
.btn.danger{color:var(--bad)} .btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--stretchSoft);color:var(--ink2);white-space:nowrap}
.chip.Strong{background:var(--goodSoft);color:var(--good)} .chip.Good{background:var(--warnSoft);color:var(--warn)} .chip.Stretch{background:var(--stretchSoft);color:var(--stretch)}
.chip.ok{background:var(--goodSoft);color:var(--good)} .chip.miss{background:#fff;border:1px dashed var(--line);color:var(--muted)}
.chip.st-Shortlisted{background:var(--accentSoft);color:var(--accent)} .chip.st-Applied,.chip.st-Offer{background:var(--goodSoft);color:var(--good)}
.chip.st-Interviewing{background:#F0F9FF;color:#0369A1} .chip.st-Rejected,.chip.st-Withdrawn{background:var(--badSoft);color:var(--bad)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;line-height:1.15} .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366F1,#4338CA);display:grid;place-items:center;color:#fff}
.brand .mark svg{width:17px;height:17px} .brand small{font-weight:500;color:var(--muted);font-size:11px}
.tabs{display:flex;gap:4px;margin-left:12px;flex:1} .tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:500;cursor:pointer;border:0;background:none;font-size:13.5px;position:relative}
.tab svg{width:17px;height:17px;flex:none} .tab span{white-space:nowrap} .tab:hover{background:var(--soft);color:var(--ink)} .tab.on{background:var(--accentSoft);color:var(--accent)}
.tab .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:17px}
.spacer{flex:1}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
/* overview */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px} .stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.5px} .stat span{color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px} .cols>*,.stack>*{min-width:0} .stack{display:flex;flex-direction:column;gap:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer} .list-row:first-of-type{border-top:0}
.list-row .grow{flex:1;min-width:0} .list-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)} .kv:first-of-type{border-top:0} .kv span:first-child{color:var(--muted)} .kv span:last-child{text-align:right}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)} .check:first-of-type{border-top:0}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.dot.done{background:var(--goodSoft);color:var(--good)} .dot.todo{background:var(--stretchSoft);color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--warnSoft);color:var(--warn);margin-bottom:16px;border:1px solid #FDE68A} .banner svg{width:18px;height:18px}
/* jobs */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) 1.4fr;gap:10px;margin-bottom:12px;align-items:end}
.filters label{font-size:11.5px;color:var(--muted);font-weight:500;display:block;margin-bottom:4px}
.range{display:flex;align-items:center;gap:8px} .range input[type=range]{padding:0;accent-color:var(--accent);border:0} .range output{font-weight:600;min-width:22px;text-align:right}
.jobs{display:flex;flex-direction:column;gap:12px}
.job{display:grid;grid-template-columns:62px 1fr auto;gap:16px;align-items:start;cursor:pointer;transition:border-color .15s}
.job:hover{border-color:#C7D2FE} .job.dim{opacity:.6}
.ring{--p:0;--c:var(--stretch);width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#EEF0F4 0);display:grid;place-items:center;flex:none}
.ring span{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.ring.Strong{--c:var(--good)} .ring.Good{--c:#F59E0B}
.list-row .ring{width:44px;height:44px} .list-row .ring span{width:34px;height:34px;font-size:13px}
.job h3{margin:6px 0 1px} .job .co{color:var(--ink2);font-weight:500} .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px;margin-top:6px}
.meta span{display:inline-flex;align-items:center;gap:5px} .meta svg{width:14px;height:14px}
.bars{display:flex;gap:6px;margin-top:10px;max-width:440px} .bar{flex:1} .bar i{display:block;height:5px;border-radius:3px;background:#EEF0F4;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent);border-radius:3px} .bar small{font-size:10.5px;color:var(--muted)}
.job-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:140px}
.job-actions .row{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;padding:48px 20px;color:var(--muted)} .empty svg{width:40px;height:40px;color:#CBD5E1;margin-bottom:8px}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.25)}
.modal.small{max-width:440px} .modal-h{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.modal-b{padding:14px 20px} .modal-f{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.desc{white-space:pre-wrap;color:var(--ink2);background:var(--soft);border-radius:10px;padding:12px;max-height:260px;overflow:auto;font-size:13px}
.sec{margin-top:16px} .sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.brk{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.brk i{height:7px;border-radius:4px;background:#EEF0F4;overflow:hidden;display:block} .brk i b{display:block;height:100%;background:var(--accent)}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;animation:up .2s}
.toast.err{background:var(--bad)}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(8px);opacity:0}}
/* applications */
.apps{display:flex;flex-direction:column;gap:12px}
.app-grid{display:grid;grid-template-columns:1fr 1fr 1.8fr auto;gap:10px;align-items:end;margin-top:12px}
.app-grid label{font-size:11.5px;color:var(--muted);font-weight:500;display:block;margin-bottom:4px}
.due{color:var(--bad);font-weight:600}
/* cv + settings */
.drop{display:block;border:2px dashed #C7D2FE;background:var(--accentSoft);border-radius:14px;padding:26px;text-align:center;cursor:pointer;transition:background .15s}
.drop.over{background:#E0E7FF} .drop svg{width:30px;height:30px;color:var(--accent)}
.plan{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0} .plan td,.plan th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;word-break:break-word}
.plan th{color:var(--muted);font-weight:500;font-size:12px}
.warn{background:var(--warnSoft);border:1px solid #FDE68A;color:#92400E;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.set{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:10px 16px;align-items:center}
.set h4{grid-column:1/-1;margin:14px 0 2px;font-size:13px;color:var(--accent)} .set h4:first-child{margin-top:0}
.err{color:var(--bad);font-size:13px}
/* gate */
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}
#gate .card{max-width:380px;width:100%;text-align:center;padding:28px}
#gate input{text-align:center;font-size:22px;letter-spacing:8px;margin:8px 0} #gate #setupCode{font-size:15px;letter-spacing:2px}
/* phones */
.bottom{display:none}
@media (max-width:860px){
 .tabs{display:none} .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom .tab{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px} .bottom .tab .badge{position:absolute;top:2px;left:calc(50% + 6px)}
 .top .btn span{display:none}
 .stats{grid-template-columns:repeat(2,1fr)} .stats .stat:first-child{grid-column:1/-1}
 .cols{grid-template-columns:1fr} .filters{grid-template-columns:1fr 1fr} .filters .f-q,.filters .f-r{grid-column:1/-1}
 .job{grid-template-columns:50px 1fr;gap:12px} .job>.ring{width:48px;height:48px} .job>.ring span{width:38px;height:38px;font-size:14px}
 .job-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;min-width:0} .job-actions .row{justify-content:flex-start}
 .job-actions>.btn,.job-actions>.chip{flex:1}
 .app-grid{grid-template-columns:1fr 1fr} .app-grid .wide{grid-column:1/-1}
 .set{grid-template-columns:1fr} .modal{max-height:92vh}
 main{padding-top:16px}
}
</style></head><body>

<section id="gate">
 <div class="card">
  <div class="brand" style="justify-content:center;margin-bottom:14px"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>Job Finder</div>
  <h2 id="gateTitle">Enter your PIN</h2>
  <p class="muted small" id="gateHelp" style="margin:6px 0 10px"></p>
  <input id="setupCode" class="hidden" placeholder="One-time setup code" autocomplete="off">
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="••••" onkeydown="if(event.key==='Enter')gateGo()">
  <button class="btn primary" style="width:100%;margin-top:6px;padding:11px" onclick="gateGo()" id="gateBtn">Unlock</button>
  <div id="gateMsg" class="err" style="margin-top:10px"></div>
 </div>
</section>

<div id="app" class="hidden">
 <header class="top"><div class="top-in">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><div>Job Finder<br><small>v<?= version ?></small></div></div>
  <nav class="tabs" id="tabsTop"></nav><div class="spacer"></div>
  <button class="btn ghost icon" onclick="refresh(true)" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  <button class="btn" onclick="lockNow()" title="Lock this page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Lock</span></button>
 </div></header>
 <main id="view"></main>
 <nav class="bottom" id="tabsBottom"></nav>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ---------- basics ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
 jobs:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
 apps:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
 cv:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>', ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 brief:'<path d="M4 7h16v12H4zM9 7V5h6v2"/>', cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>', search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', check:'<path d="M5 12l5 5 9-10"/>'
};
const ic=(n,fill)=>'<svg viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),err?6000:3500)}
/** Small promise-based dialog. Resolves with the clicked action's value (or null when closed). */
function modal({title,body,actions,size}){return new Promise(res=>{const s=document.createElement('div');s.className='scrim';
 s.innerHTML='<div class="modal '+(size||'small')+'"><div class="modal-h"><div>'+title+'</div><button class="btn ghost icon" data-v="__x">'+ic('x')+'</button></div><div class="modal-b">'+(body||'')+'</div>'+
 (actions&&actions.length?'<div class="modal-f">'+actions.map((a,i)=>'<button class="btn '+(a.cls||'')+'" data-i="'+i+'">'+a.label+'</button>').join('')+'</div>':'')+'</div>';
 const close=v=>{s.remove();document.removeEventListener('keydown',key);res(v)};const key=e=>{if(e.key==='Escape')close(null)};document.addEventListener('keydown',key);
 s.addEventListener('click',e=>{if(e.target===s)return close(null);const b=e.target.closest('button');if(!b)return;if(b.dataset.v==='__x')return close(null);
  if(b.dataset.i!=null){const a=actions[+b.dataset.i];close(a.read?a.read(s):a.value!==undefined?a.value:true)}});
 document.body.appendChild(s);const f=s.querySelector('textarea,input');if(f)f.focus()})}
const confirmBox=(title,text,ok)=>modal({title:'<h2>'+title+'</h2>',body:'<p class="muted" style="margin:0">'+text+'</p>',actions:[{label:'Cancel',value:false},{label:ok||'OK',cls:'primary',value:true}]});

/* ---------- server bridge (every call carries the PIN unlock) ---------- */
let TOKEN='',GATE={},D=null,TAB='overview';
try{TOKEN=sessionStorage.getItem('jf')||'';TAB=sessionStorage.getItem('jfTab')||'overview'}catch(e){}
function call(fn,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{
 if(/NEEDS_PIN/.test(e.message)){TOKEN='';try{sessionStorage.removeItem('jf')}catch(x){}showGate();no(new Error('Please unlock again'))}else no(e)})[fn](TOKEN,...args))}
const fail=e=>toast(e.message||String(e),true);

/* ---------- PIN screen ---------- */
function showGate(){$('#app').classList.add('hidden');$('#gate').classList.remove('hidden');
 google.script.run.withSuccessHandler(st=>{GATE=st;const t=$('#gateTitle'),h=$('#gateHelp'),b=$('#gateBtn');
  if(st.canCreate){t.textContent='Create your PIN';h.textContent=(st.needsSetupCode?'Enter your one-time setup code, then choose a PIN. ':'')+'4–12 digits. Longer is safer; avoid numbers from your email or phone.';b.textContent='Create PIN';$('#setupCode').classList.toggle('hidden',!st.needsSetupCode)}
  else if(!st.hasPin){t.textContent='Not set up yet';h.textContent='The owner has not created a PIN yet.';b.disabled=true}
  else{t.textContent='Enter your PIN';h.textContent=st.lockedMinutes?'Locked for '+st.lockedMinutes+' more minutes after wrong PINs.':'This page is private to its owner.'}
  $('#pin').focus()}).pinStatus()}
function gateGo(){const pin=$('#pin').value,m=$('#gateMsg');m.textContent='';
 const done=r=>{if(r.ok){TOKEN=r.token;try{sessionStorage.setItem('jf',TOKEN)}catch(e){}$('#pin').value='';openApp()}else m.textContent=r.message};
 const err=e=>m.textContent=e.message;
 if(GATE.canCreate){if(!/^\d{4,12}$/.test(pin)){m.textContent='Use 4 to 12 digits.';return}
  modal({title:'<h2>Confirm your PIN</h2>',body:'<input id="pin2" type="password" inputmode="numeric" placeholder="Type the same PIN again">',actions:[{label:'Cancel',value:null},{label:'Create PIN',cls:'primary',read:s=>s.querySelector('#pin2').value}]})
   .then(v=>{if(v==null)return;if(v!==pin){m.textContent='The two PINs did not match.';return}google.script.run.withSuccessHandler(done).withFailureHandler(err).createPin(pin,$('#setupCode').value)})}
 else google.script.run.withSuccessHandler(done).withFailureHandler(err).unlock(pin)}
function openApp(){$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');renderTabs();$('#view').innerHTML='<div class="empty">Loading your dashboard…</div>';refresh()}
function lockNow(){TOKEN='';try{sessionStorage.removeItem('jf')}catch(e){}D=null;showGate()}

/* ---------- navigation ---------- */
const TABS=[['overview','Overview','home'],['jobs','Jobs','jobs'],['apps','Applications','apps'],['cv','My CV','cv'],['settings','Settings','gear']];
function renderTabs(){const badge=k=>{if(!D)return'';const n=k==='jobs'?newMatches().length:k==='apps'?D.applications.filter(a=>a.due).length:0;return n?'<span class="badge">'+n+'</span>':''};
 const html=TABS.map(([k,l,i])=>'<button class="tab'+(TAB===k?' on':'')+'" onclick="go(\''+k+'\')">'+ic(i)+'<span>'+l+'</span>'+badge(k)+'</button>').join('');
 $('#tabsTop').innerHTML=html;$('#tabsBottom').innerHTML=html}
function go(k){TAB=k;try{sessionStorage.setItem('jfTab',k)}catch(e){}renderTabs();render();window.scrollTo(0,0)}

 $('#cvout').innerHTML='<div class="card" style="margin-top:16px"><h2>Here\'s what I found</h2>'+(cv.warnings.length?'<div class="warn"><b>Please check:</b><br>'+cv.warnings.map(esc).join('<br>')+'</div>':'')+
  '<div class="sec"><h4>Jobs · '+cv.totalYears+' years in total (internships not counted)</h4>'+cv.experience.map(e=>'<div class="kv"><span style="color:var(--ink)"><b>'+esc(e.role||'(title not found)')+'</b> · '+esc(e.company||'(company not found)')+'</span><span>'+esc(e.start)+' – '+esc(e.end)+'</span></div>').join('')+'</div>'+
  '<div class="sec"><h4>Settings this will fill in</h4><table class="plan"><tr><th>Setting</th><th>Now</th><th>After</th></tr>'+res.plan.map(p=>'<tr><td>'+esc(p.field)+'</td><td class="muted">'+esc(p.current||'–')+'</td><td>'+(p.change?'<b>'+esc(p.proposed)+'</b>':esc(p.current||'–')+' <span class="muted small">(kept)</span>')+'</td></tr>').join('')+'</table></div>'+
  '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="$(\'#cvout\').innerHTML=\'\'">Cancel</button><button class="btn primary" onclick="useCv()">Use this CV</button></div></div>';
 $('#cvout').scrollIntoView({behavior:'smooth'})}
function useCv(){confirmBox('Use this CV?','Your profile and search settings will be updated as shown. You can edit any of them later.','Use this CV').then(v=>{if(!v)return;
 call('applyCv',CVDOC).then(r=>{toast(r.changed.length+' settings updated');refresh()}).catch(fail)})}

/* ---------- settings ---------- */
let SETTINGS=[];
function renderSettings(){$('#view').innerHTML='<div class="page-head"><div><h1>Settings</h1><div class="muted">Changes apply from the next check, within 5 minutes.</div></div></div>'+
 '<div class="card"><div class="set" id="setForm">Loading…</div><div id="setMsg" style="margin-top:10px"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap"><button class="btn" onclick="testMail()">Send me a test alert</button><button class="btn primary" onclick="saveSet()">Save settings</button></div></div>'+
 '<div class="card" style="margin-top:16px"><h2>Security</h2><p class="muted small">This page is public but locked by your PIN. Five wrong tries lock it, and you get an email.</p>'+
 '<div class="app-grid"><div><label>Current PIN</label><input id="oldPin" type="password" inputmode="numeric"></div><div><label>New PIN (4–12 digits)</label><input id="newPin" type="password" inputmode="numeric"></div><div class="wide"><button class="btn" onclick="changePinNow()">Change PIN</button></div></div></div>';
 call('getSettings').then(list=>{SETTINGS=list;let g='';$('#setForm').innerHTML=list.map((s,i)=>{const head=s.group!==g?'<h4>'+esc(g=s.group)+'</h4>':'';
  const input=s.type==='yesno'?'<select id="set'+i+'"><option value="NO"'+(s.value==='NO'?' selected':'')+'>No</option><option value="YES"'+(s.value==='YES'?' selected':'')+'>Yes</option></select>'
   :'<input id="set'+i+'" value="'+esc(s.value)+'"'+(s.type==='number'?' inputmode="decimal"':'')+(s.help?' placeholder="'+esc(s.help)+'"':s.type==='time'?' placeholder="HH:MM"':'')+'>';
  return head+'<label for="set'+i+'">'+esc(s.label)+'</label>'+input}).join('')}).catch(fail)}
function saveSet(){const ch={};SETTINGS.forEach((s,i)=>{const v=$('#set'+i).value;if(v!==String(s.value))ch[s.key]=v});const msg=$('#setMsg');
 if(!Object.keys(ch).length)return toast('Nothing changed');
 call('saveSettings',ch).then(r=>{if(r.ok){msg.innerHTML='';toast('Saved: '+r.saved.join(', '));refresh()}
  else msg.innerHTML='<div class="warn"><b>Not saved.</b><br>'+r.errors.map(esc).join('<br>')+'</div>'}).catch(fail)}
function testMail(){confirmBox('Send a test alert?','One sample email goes to your alert address.','Send').then(v=>{if(v)call('sendTestAlert').then(to=>toast('Test email sent to '+to)).catch(fail)})}
function changePinNow(){const o=$('#oldPin').value,n=$('#newPin').value;if(!/^\d{4,12}$/.test(n))return toast('New PIN: use 4 to 12 digits',true);
 modal({title:'<h2>Confirm new PIN</h2>',body:'<input id="pin2" type="password" inputmode="numeric" placeholder="Type the new PIN again">',actions:[{label:'Cancel',value:null},{label:'Change PIN',cls:'primary',read:s=>s.querySelector('#pin2').value}]})
 .then(v=>{if(v==null)return;if(v!==n)return toast('The two PINs did not match',true);call('changePin',o,n).then(()=>{$('#oldPin').value=$('#newPin').value='';toast('PIN changed')}).catch(fail)})}

if(TOKEN)openApp();else showGate();
</script></body></html>
