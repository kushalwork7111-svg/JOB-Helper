<script>
'use strict';
const state = {drafts:{}, appDrafts:{}, data: null, page: 'overview', filter: 'matches', search: '', busy: false, selectedApp: null, sessionToken: (()=>{try{return sessionStorage.getItem('job-helper-session')||'';}catch{return '';}})()};
const titles = {overview:'Overview',jobs:'Opportunities',pipeline:'Application pipeline',prep:'Interview studio',profile:'My CV & profile',settings:'Preferences'};
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr = esc;
const date = value => value && Number.isFinite(Date.parse(value)) ? new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(new Date(value)) : 'Not yet';
const initial = value => esc((value || 'J').trim().slice(0,1).toUpperCase());
const link = value => /^https:\/\/[a-z0-9.-]+(?::443)?(?:[/?#][^\s<>]*)?$/i.test(value || '') ? attr(value) : '#';
const label = value => ({strong:'Strong fit',stretch:'Stretch fit',weak:'Low fit',unassessed:'Needs review',draft:'Draft',ready:'Ready for review',handoff:'Form handoff',sent_email:'Email sent',submitted_external:'Submitted by you',replied:'Reply received',acknowledged:'Acknowledged',screening:'Screening',assessment:'Assessment',accepted:'Accepted',interview:'Interview',offer:'Offer',rejected:'Not progressing',withdrawn:'Withdrawn'}[value] || value || 'Needs review');
const tag = (text, color='') => `<span class="tag ${color}">${esc(text)}</span>`;
const empty = (title, text, action='', button='') => `<div class="empty"><strong>${esc(title)}</strong><p>${esc(text)}</p>${action?`<button class="btn" data-action="${attr(action)}">${esc(button)}</button>`:''}</div>`;
const heading = (title, description, actions='') => `<div class="page-heading"><div><div class="eyebrow">YOUR NEXT CHAPTER</div><h1>${esc(title)}</h1><p class="subtitle">${esc(description)}</p></div><div class="actions">${actions}</div></div>`;
function call(action, payload={}) {
  return new Promise((resolve,reject) => {
    if (!window.google?.script?.run) { reject(new Error('Open the deployed Google Apps Script web app. This page requires its authenticated backend.')); return; }
    google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error.message || String(error)))).api(action,{...payload,...(state.sessionToken?{sessionToken:state.sessionToken}:{})});
  });
}
function toast(message, error=false) {
  const el=$('#toast'); el.textContent=message; el.className='show'+(error?' error':'');
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.className='',error?10000:6500);
}
async function work(labelText, fn) {
  if(state.busy)return;
  state.busy=true; $('#busy-label').textContent=labelText; $('#busy-overlay').hidden=false;
  const buttons=$$('button'); const prior=buttons.map(b=>b.disabled); buttons.forEach(b=>b.disabled=true);
  try{return await fn();}catch(e){toast(e.message,true);return null;}
  finally{state.busy=false;$('#busy-overlay').hidden=true;buttons.forEach((b,i)=>b.disabled=prior[i]);}
}
async function reload() {
  try { state.data=await call('bootstrap'); render(); }
  catch(error) {
    if (/Sign in again|Owner access required/.test(error.message)) { const info=await call('authInfo'); if(info.shared){clearSession();showLogin();return;} }
    throw error;
  }
}
function render() {
  const d=state.data;
  $('.sidebar').style.display='';
  $('#session-actions').innerHTML=(d?.isHost?'<button class="btn small" data-action="accounts">Access</button>':'')+(d?.shared?'<button class="btn small" data-action="logout">Sign out</button>':'');
  $('#main').setAttribute('aria-busy','false');
  $('#page-title').textContent=titles[state.page];
  $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
  if(!d?.initialized){
    $('#main').innerHTML=heading('Let’s set up your workspace','A private home for your CV, job matches, and next steps.')+`<div class="panel">${empty('One quick setup step','In the Apps Script editor, run setupJobHelper once and authorize your own account. Then refresh this dashboard.','refresh','I’ve run setup · Refresh')}</div>`;return;
  }
  $('#account-name').textContent=d.profile.name||'Your workspace';$('#avatar').textContent=(d.profile.name||'Y').slice(0,1).toUpperCase();
  $('#connection').textContent=window.__JOB_HELPER_DEMO__?'DEMO · sample data':!d.settings.features.ai?'Local drafting · AI off':d.hasGateway?'AI gateway configured':d.hasGeminiKey?'Gemini configured':'AI enabled · connection needed';
  $('#connection').className='chip'+(d.hasGeminiKey||d.hasGateway?'':' amber');
  $('#nav-count').textContent=matches().length;
  const pages={overview:overviewPage,jobs:jobsPage,pipeline:pipelinePage,prep:prepPage,profile:profilePage,settings:settingsPage};
  $('#main').innerHTML=(window.__JOB_HELPER_DEMO__?'<div class="banner">Local design preview · all jobs, CV details, and activity below are fictional sample data. No email or application can be sent.</div>':'')+pages[state.page]();
  restoreEdits();
  applyFeatureVisibility();
  const aiKey=$('[name=geminiKey]');if(aiKey&&!d.isHost){aiKey.disabled=true;aiKey.placeholder='Managed by the hosting account';}
}
function navigate(page){rememberEdits();state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});}
function fresh(job){return job.openState==='open'&&Date.now()-Date.parse(job.verifiedAt)<=86400000;}
function matches(){return state.data.jobs.filter(j=>j.decision!=='dismissed'&&j.decision!=='watchlist'&&fresh(j)&&!j.gates?.rejected&&j.assessment?.score>=state.data.settings.minimumScore&&j.assessment?.fit!=='weak'&&(state.data.settings.includeStretch||j.assessment?.fit!=='stretch')).sort((a,b)=>b.assessment.score-a.assessment.score);}
function salary(job){
  const s=job.salary;
  if(!s?.max)return 'Salary not disclosed';
  return `${s.currency||''} ${Number(s.min||0).toLocaleString()}–${Number(s.max).toLocaleString()} / ${s.interval||'period unknown'}`;
}
function fitTags(job){return (job.source.type==='manual'?tag('User-confirmed source','amber')+' ':'')+tag(label(job.assessment?.fit),job.assessment?.fit==='strong'?'':job.assessment?.fit==='stretch'?'amber':'muted')+' '+tag(fresh(job)?'Verified open':job.openState==='closed'?'Closed':'Recheck status',fresh(job)?'':job.openState==='closed'?'red':'amber');}
function jobRow(job){return `<div class="job-row"><div class="company-avatar">${initial(job.company)}</div><div class="job-row-body"><h3>${esc(job.title)}</h3><div class="job-meta">${esc(job.company)} · ${esc(job.location)}</div><div class="tags">${fitTags(job)}</div><button class="btn ghost small" data-action="job" data-id="${attr(job.id)}">Explore opportunity ↗</button></div><div class="score ${job.assessment?.fit==='stretch'?'amber':''}" title="Fit score, not a hiring probability">${job.assessment?.score??'—'}</div></div>`;}
function overviewPage(){
  const d=state.data,short=matches(),apps=d.applications,active=apps.filter(a=>!['draft','ready','handoff','rejected','withdrawn'].includes(a.status));
  const due=d.reminders.filter(r=>!r.complete).sort((a,b)=>Date.parse(a.dueAt)-Date.parse(b.dueAt));
  const name=(d.profile.name||'there').split(' ')[0];
  return heading(`Good to see you, ${name}.`,'A clear view of your search. A little closer to your next role.',`<button class="btn" data-action="digest">✉ Send my briefing</button><button class="btn primary" data-action="scan">⌕ Find opportunities</button>`)
    +`<section class="hero"><div><div class="eyebrow">YOUR OPPORTUNITY RADAR</div><h2>${short.length?'Your next move is taking shape.':'Let’s find your next opportunity.'}</h2><p>${short.length?'Explore verified postings, understand your fit, and go into every application prepared.':'Add your CV and target criteria, approve your career facts, then import a job or choose employer boards to scan.'}</p><div class="actions"><button class="btn primary" data-page="${d.profile.cvText?'jobs':'profile'}">${d.profile.cvText?'Explore my matches ↗':'Build my profile ↗'}</button><button class="btn ghost" data-page="settings">Fine-tune my search</button></div></div><div class="hero-note"><strong>${short.length}</strong><span>roles in your shortlist<br>verified on employer boards</span></div></section>`
    +`<div class="stat-grid">${stat('Relevant opportunities',short.length,'Meet your saved filters','⌕')}${stat('Active applications',active.length,'Your ongoing conversations','↗')}${stat('Stretch opportunities',short.filter(j=>j.assessment?.fit==='stretch').length,'Transferable skills worth exploring','◇')}${stat('Upcoming reminders',due.length,'Follow-ups and preparation','◷')}</div>`
    +`<div class="overview-grid"><div><section class="panel"><div class="panel-head"><div><h2>Picked for your next chapter</h2><p>Ranked by fit, with the evidence behind every match.</p></div><button class="btn ghost small" data-page="jobs">View all ↗</button></div>${short.slice(0,4).map(jobRow).join('')||empty('Your shortlist starts here','Save your CV and preferences, then scan employer job boards.','profile','Add my CV')}</section><section class="panel mt"><div class="panel-head"><div><h2>Your search is working for you</h2><p>Daily briefing & scan status</p></div>${tag(d.automationInstalled?'Daily briefing enabled':'Daily briefing off',d.automationInstalled?'':'muted')}</div><p class="note">Last scan: ${esc(date(d.lastScan))}. ${d.automationInstalled?`Email arrives around ${d.settings.digestHour}:00 in ${esc(d.settings.timezone)}; Google schedules within the hour.`:'Enable your daily scan and email in Preferences.'} Applications and outreach always wait for your approval.</p><button class="btn small" data-page="settings">Manage automation</button></section></div>`
    +`<div><section class="panel"><div class="panel-head"><h2>Stay one step ahead</h2><button class="btn ghost small" data-action="reminder">+ Add</button></div>${due.slice(0,5).map(r=>`<div class="reminder"><button data-action="complete-reminder" data-id="${attr(r.id)}" aria-label="Complete ${attr(r.title)}"></button><div><p>${esc(r.title)}</p><small class="${Date.parse(r.dueAt)<Date.now()?'overdue':''}">${esc(date(r.dueAt))}${Date.parse(r.dueAt)<Date.now()?' · due':''}</small></div></div>`).join('')||empty('A little breathing room','Your follow-up reminders will appear here after you apply.')}</section><section class="panel mt"><div class="panel-head"><h2>Workspace activity</h2></div>${d.activity.slice(0,5).map(a=>`<div class="timeline-item">${esc(a.message)}<small>${esc(date(a.at))}</small></div>`).join('')||empty('Ready when you are','Your scans and application updates appear here.')}</section></div></div>`;
}
function stat(title,value,description,icon){return `<div class="stat"><div class="stat-top">${esc(title)}<span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${esc(description)}</small></div>`;}
function visibleJobs(){
  let jobs=state.data.jobs;
  if(state.filter==='matches')jobs=matches();
  if(state.filter==='stretch')jobs=matches().filter(j=>j.assessment?.fit==='stretch');
  if(state.filter==='review')jobs=jobs.filter(j=>j.openState!=='closed'&&(!fresh(j)||j.gates?.rejected||j.assessment?.fit==='unassessed'||!j.assessment||j.assessment.score<state.data.settings.minimumScore));
  if(state.filter==='watchlist')jobs=jobs.filter(j=>j.decision==='watchlist');
  if(state.filter==='dismissed')jobs=jobs.filter(j=>j.decision==='dismissed');
  if(state.filter==='closed')jobs=jobs.filter(j=>j.openState==='closed');
  const search=state.search.toLowerCase();return jobs.filter(j=>[j.title,j.company,j.location].join(' ').toLowerCase().includes(search));
}
function jobsPage(){return heading('Opportunities, with perspective.','See where you fit, where you could grow, and what to prepare.',`<button class="btn" data-action="import-job">+ Import a job</button><button class="btn primary" data-action="scan">⌕ Refresh opportunities</button>`)+`<div class="toolbar"><div class="segments">${[['matches','My matches'],['stretch','Stretch fits'],['review','Needs review'],['watchlist','Watchlist'],['dismissed','Dismissed'],['closed','Closed']].map(([v,l])=>`<button data-filter="${v}" class="${state.filter===v?'selected':''}">${l}</button>`).join('')}</div><input class="search" id="job-search" type="search" placeholder="Search role, company, location…" value="${attr(state.search)}" aria-label="Search opportunities"></div><div id="job-results">${jobResults()}</div>`;}
function jobResults(){const jobs=visibleJobs();return `<p class="micro" style="margin:0 0 15px">${jobs.length} opportunities · minimum fit score ${state.data.settings.minimumScore} · verified open status expires after 24 hours</p><div class="job-grid">${jobs.map(j=>`<article class="job-card"><div class="job-card-top"><div class="company-avatar">${initial(j.company)}</div><div class="score ${j.assessment?.fit==='stretch'?'amber':''}">${j.assessment?.score??'—'}</div></div><div class="tags">${fitTags(j)}</div><h3>${esc(j.title)}</h3><p class="job-meta">${esc(j.company)} · ${esc(j.location)}</p><p class="micro">${esc(salary(j))}</p><p class="summary">${esc(j.assessment?.summary||'Review the role and assess it against your CV.')}</p>${j.gates?.warnings?.length?`<p class="micro">⚑ ${esc(j.gates.warnings[0])}</p>`:''}<div class="actions"><button class="btn primary small" data-action="prepare" data-id="${attr(j.id)}" ${j.openState==='closed'?'disabled':''}>Prepare application</button><button class="btn small" data-action="job" data-id="${attr(j.id)}">Fit & preparation ↗</button></div><p class="micro">Checked ${esc(date(j.verifiedAt))} · ${esc(j.source.type)}</p></article>`).join('')||`<div class="panel wide">${empty('No opportunities in this view','Adjust your preferences, add more employer boards, or scan again.','settings','Review preferences')}</div>`}</div>`;}
function pipelinePage(){const apps=state.data.applications;return heading('Every application. One clear path.','Keep drafts, submissions, replies, and follow-ups in view.',`<button class="btn" data-action="sync-replies">↻ Check inbox replies</button><button class="btn primary" data-page="jobs">Explore opportunities ↗</button>`)+`<div class="pipeline-stats">${[['draft','Drafts'],['ready','Ready'],['sent_email','Email sent'],['submitted_external','Form submissions'],['interview','Interviews'],['offer','Offers']].map(([s,l])=>`<span>${l}<b>${apps.filter(a=>a.status===s).length}</b></span>`).join('')}</div><section class="panel"><div class="table-scroll"><table><thead><tr><th>Opportunity</th><th>Stage</th><th>Last update</th><th>Next step</th></tr></thead><tbody>${apps.map(a=>`<tr><td><b>${esc(a.title)}</b><small>${esc(a.company)}</small></td><td>${tag(label(a.status),a.status==='draft'?'muted':'')}${a.delivery?.phase==='uncertain'?tag('Delivery uncertain','amber'):''}</td><td>${esc(date(a.updatedAt||a.submittedAt||a.createdAt))}</td><td><button class="btn small" data-action="application" data-id="${attr(a.id)}">Review workspace ↗</button></td></tr>`).join('')}</tbody></table></div>${apps.length?'':empty('Your pipeline is ready','Prepare an application from a job card. Nothing is submitted until you approve.','jobs','Find an opportunity')}</section><p class="note">“Email sent” means Google accepted your email for sending. Employer receipt and external form submission need separate confirmation.</p>`;}
function preparation(items){return (items||[]).map((p,i)=>`<div class="prep-topic"><div class="step-number">PREP ${String(i+1).padStart(2,'0')}</div><h3>${esc(p.topic)}</h3><p>${esc(p.action)}</p>${p.practice?`<p><b>Practice:</b> ${esc(p.practice)}</p>`:''}${p.materials?.length?`<ul>${p.materials.map(m=>`<li><a href="${link(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.title)} ↗</a></li>`).join('')}</ul><small>Suggested resources from AI. Check the page and its suitability before relying on it.</small>`:''}</div>`).join('')||'<p class="note">Generate this job’s assessment or application packet to get a targeted preparation plan.</p>';}
function prepPage(){const apps=state.data.applications;return heading('Walk in prepared.','A focused learning plan, interview drills, and honest positioning for every application.')+`<div class="job-grid">${apps.map(a=>`<article class="prep-card"><div class="eyebrow">INTERVIEW WORKSPACE</div><h3>${esc(a.title)}</h3><p class="job-meta">${esc(a.company)} · ${label(a.status)}</p>${preparation(a.preparation.slice(0,2))}<div class="actions"><button class="btn primary small" data-action="application" data-id="${attr(a.id)}">Full prep & practice ↗</button></div></article>`).join('')||`<div class="panel wide">${empty('Preparation begins with an opportunity','Your assessed jobs include gap-specific learning plans. Preparing an application adds interview questions and resume suggestions.','jobs','Explore matches')}</div>`}</div>`;}
function profilePage(){const p=state.data.profile;return heading('Your story, accurately represented.','Your CV is the source of truth. Review extracted skills and never add experience you haven’t earned.')+`<div class="section-grid"><section class="panel"><h2>CV & contact details</h2><p class="note">${state.data.shared?'Your records are limited to your site login. The hosting Google account stores and can access the data.':'Your CV stays in your private Google Drive/Sheet.'} Optional analysis sends text to the configured AI backend.</p><div class="file-drop"><b>Import your CV</b><p>PDF or plain text · up to 5 MB. For scanned PDFs, review the extracted text carefully.</p><input type="file" id="cv-file" accept="application/pdf,text/plain,.pdf,.txt" aria-label="Upload CV"></div><form id="profile-form"><div class="form-row"><label class="field"><span>Full name</span><input name="name" value="${attr(p.name)}" placeholder="Your name"></label><label class="field"><span>Contact email</span><input type="email" name="email" value="${attr(p.email||state.data.owner)}" required></label></div><label class="field"><span>CV text</span><textarea name="cvText" rows="16" minlength="100" maxlength="24000" required placeholder="Paste your full CV here…">${esc(p.cvText)}</textarea><small class="field-hint">Maximum 24,000 characters. Saving new CV text resets old job assessments.</small></label><div class="actions"><button class="btn" type="submit">Save profile</button><button class="btn primary" type="button" data-action="analyze-cv">✳ Analyze my CV</button></div></form></section><div><section class="panel"><h2>Your professional toolkit</h2><p class="note">Extracted from your CV · review for accuracy</p><div class="skills">${(p.skills||[]).map(s=>tag(s)).join('')||'<p class="note">Analyze your CV to extract skills.</p>'}</div><h3 class="mt">Experience highlights</h3><ul class="question-list">${(p.experience||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="panel mt"><h2>Details worth clarifying</h2><p class="note">The agent will ask job-specific questions before an application is sent.</p><ul class="question-list">${(p.questions||[]).map(q=>`<li>${esc(q)}</li>`).join('')||'<li>Work authorization, notice period, salary expectations, and relocation can affect eligibility.</li>'}</ul></section><div class="banner mt">Your CV and API credentials are private. ${state.data.shared?'Only invited users can sign in; each sees their own records.':'Deploy this app with access set to <b>Only myself</b>.'}</div></div></div>${factsPanel()}`;}
function field(name,title,value,type='text',hint=''){return `<label class="field"><span>${esc(title)}</span><input name="${attr(name)}" type="${type}" value="${attr(value)}">${hint?`<small class="field-hint">${esc(hint)}</small>`:''}</label>`;}
function check(name,title,value){return `<label class="check"><input name="${attr(name)}" type="checkbox" ${value?'checked':''}><span>${esc(title)}</span></label>`;}
function sourceRow(s={type:'greenhouse',board:'',company:''}){return `<div class="source-row"><select class="source-type" aria-label="Board platform">${['greenhouse','lever','ashby'].map(t=>`<option ${t===s.type?'selected':''} value="${t}">${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select><input class="source-company" placeholder="Company name" value="${attr(s.company)}" aria-label="Company name"><input class="source-board" placeholder="Board slug" value="${attr(s.board)}" aria-label="Board slug"><button type="button" data-action="remove-source" aria-label="Remove employer board">×</button></div>`;}
function settingsPage(){const s=state.data.settings;return heading('Make the search yours.','Set clear criteria. Keep promising stretch roles in view. Stay in control of every send.')+`<form id="settings-form"><div class="section-grid"><section class="panel"><h2>Your opportunity criteria</h2><p class="note">Separate multiple roles, locations, or keywords with commas.</p>${field('roles','Target roles',s.roles.join(', '),'text','Example: financial analyst, transaction advisory, FDD, valuation')}${field('locations','Preferred locations',s.locations.join(', '),'text','Example: Mumbai, Bengaluru, London. Remote country restrictions still need review.')}<div class="form-row">${field('minimumSalary','Minimum annual salary',s.minimumSalary,'number')}${field('salaryCurrency','Salary currency',s.salaryCurrency,'text','Three-letter code: INR, USD, GBP…')}</div>${check('requireSalary','Exclude jobs without verified salary in my currency',s.requireSalary)}${check('includeRemote','Include remote roles; flag country eligibility for review',s.includeRemote)}${check('includeStretch','Include plausible stretch roles with a gap & learning plan',s.includeStretch)}<div class="form-row">${field('minimumScore','Minimum fit score (0–100)',s.minimumScore,'number')}${field('maximumPostingAgeDays','Maximum posting age (days)',s.maximumPostingAgeDays,'number')}</div>${field('excludedKeywords','Exclude keywords',s.excludedKeywords.join(', '),'text','Use narrow terms; exclusions check the full job description.')}<div class="form-row">${field('seniority','Seniority preferences',s.seniority.join(', '),'text','Example: analyst, associate; assessed by AI')}${field('employmentTypes','Employment types',s.employmentTypes.join(', '),'text','Example: full time, contract')}</div>${field('industries','Industry preferences',s.industries.join(', '))}${field('workAuthorization','Work authorization / sponsorship needs',s.workAuthorization,'text','State only what you know. The agent must not infer eligibility.')}<hr class="form-divider"><div class="panel-head"><h2>Employer job boards</h2><button class="btn small" type="button" data-action="add-source">+ Add board</button></div><div id="sources">${s.sources.map(sourceRow).join('')}</div><div class="actions"><button class="btn small" type="button" data-action="discover">✳ Discover employers</button></div><div id="discovery-results"></div><div class="source-hint">We read live public employer postings from Greenhouse, Lever, and Ashby. For <b>jobs.lever.co/companyname</b>, enter <b>companyname</b> as the slug. Maximum 12 boards. Discovery uses grounded search and verifies boards before suggesting them. Coverage depends on the boards you choose.</div></section><div><section class="panel"><h2>Optional AI connection</h2>${check('feature-ai','Enable optional AI refinement',s.features.ai)}${check('externalAiConsent','I approve sending selected career facts and job text to my configured AI provider.',s.externalAiConsent)}<p class="note">Local matching, factual drafts, and document export work without AI. No paid fallback is configured.</p><p class="note">${state.data.hasGateway?'Existing AI gateway configured in Script Properties.':state.data.hasGeminiKey?'A Gemini API key is saved securely in Script Properties.':'Connect an AI backend to enable CV analysis and evidence-based matching.'}</p><label class="field"><span>Gemini API key (optional direct connection)</span><input type="password" name="geminiKey" autocomplete="new-password" placeholder="Leave blank to preserve existing key"><small class="field-hint">Google AI Studio key. Google AI Pro subscription access does not itself supply API credits.</small></label>${field('geminiModel','Model',s.geminiModel)}<button type="button" class="btn small" data-action="test-ai">Test saved connection</button><p class="note">To reuse DVCS Deal Radar, configure AI_GATEWAY_URL and AI_GATEWAY_TOKEN in Script Properties using the documented backend contract. This app needs a callable API; a Gemini chat subscription cannot be used as an API key.</p><hr class="form-divider"><h2>Your daily briefing</h2>${check('dailyEmail','Scan my boards and email me a daily briefing',s.dailyEmail)}<div class="form-row">${field('digestHour','Send around this hour (0–23)',s.digestHour,'number')}${field('followUpDays','Follow-up after (days)',s.followUpDays,'number')}</div>${field('timezone','Timezone',s.timezone,'text','Asia/Kolkata, Europe/London, America/New_York…')}<div class="approval"><b>Approval is always required</b><p class="note">Only your own daily digest runs automatically. Applications, follow-ups, and outreach are sent after you review and approve each message.</p></div><hr class="form-divider"><h3>External email pilot</h3>${check('externalSendingEnabled','Enable email to employers and contacts',s.externalSendingEnabled)}${check('confirmedTestReceipt','I received and reviewed my test-to-self briefing',false)}<p class="note">First use Send my briefing, then check your own inbox. External sending is off by default, and every individual send still needs approval.</p><h3 class="mt">Owner feature controls</h3>${Object.entries(s.features).filter(([k])=>k!=='ai').map(([k,v])=>check('feature-'+k,k[0].toUpperCase()+k.slice(1),v)).join('')}<button class="btn primary" type="submit">Save preferences</button></section><section class="panel mt"><h3>How your score works</h3><p class="note">Salary and location rules are checked separately from fit. Local screening maps requirements to approved facts. Optional Gemini matching checks quoted evidence; unverified quotes lower confidence. A fit score is an estimate, not a hiring probability.</p><p class="note">Unknown salaries stay visibly unverified unless you exclude them. Original posting dates are used when provided; board update dates are never presented as posting dates.</p></section></div></div></form>`;}
function showDialog(html){$('#dialog-content').innerHTML=html;const d=$('#detail-dialog');if(!d.open)d.showModal();d.scrollTop=0;}

document.addEventListener('click',async event=>{

  const a=b.dataset.action;

  if(a==='new-fact'||a==='edit-fact'){factDialog(b.dataset.id);return;}
  if(!['extract-facts','job-decision','verify-manual','export'].includes(a))return;

    if(a==='extract-facts'){const r=await call('extractFacts');await reload();toast(`${r.draftFacts} grouped drafts created; ${r.reviewRequired||0} need extra review. Existing approved facts were preserved.`);}

  });
});

  if(action==='remove-source'){button.closest('.source-row').remove();return;}
  if(action==='copy-letter'){await copy($('#application-form').elements.coverLetter.value);return;}
  if(action==='copy-outreach'){const a=state.data.applications.find(a=>a.id===state.selectedApp);await copy(a.outreach.find(o=>o.id===id).body);return;}
  if(action==='review-outreach'){outreachDialog(id);return;}
  if(action==='followup'){followupDialog(id);return;}
  if(action==='reminder'){showDialog(dialogHead('Make room for your next step','A reminder for research, preparation, interviews, or follow-ups.')+`<form id="reminder-form">${field('title','Reminder','')}${field('dueAt','Due at','','datetime-local')}<button class="btn primary" type="submit">Add reminder</button></form>`);return;}
  if(action==='add-discovered'){const s={type:button.dataset.type,board:button.dataset.board,company:button.dataset.company};if($$('.source-row').some(r=>$('.source-type',r).value===s.type&&$('.source-board',r).value===s.board)){toast('This board is already listed.');return;}if($$('.source-row').length>=12){toast('Maximum 12 boards.',true);return;}$('#sources').insertAdjacentHTML('beforeend',sourceRow(s));button.disabled=true;button.textContent='Added · save preferences';return;}
  await work(({scan:'Scanning live employer boards…',prepare:'Preparing your application and interview plan…',assess:'Checking the evidence behind your fit…',discover:'Discovering and verifying employer boards…','analyze-cv':'Analyzing your CV…','send-application':'Sending your approved application…'}[action]||'Updating your workspace…'),async()=>{
    if(action==='refresh'){rememberEdits();await reload();return;}
    if(action==='scan'){const r=await call('scanJobs');await reload();showDialog(dialogHead('Your opportunity radar is updated',`${r.boardsChecked} boards checked · ${r.imported} jobs imported · ${r.assessed} AI assessments`)+`<p class="note">${r.remainingAssessments} saved jobs still need AI assessment. Scans process up to 35 new jobs and 10 assessments within Apps Script’s runtime limits; scan again to continue.</p>${!r.aiConnected?'<div class="banner green">Local matching uses approved candidate facts. Optional AI is off or not connected.</div>':''}${[...r.errors,...r.warnings].map(x=>`<div class="banner">${esc(x)}</div>`).join('')}`);return;}
    if(action==='prepare'){const a=await call('prepareApplication',{id});await reload();showApplication(a.id);return;}
    if(action==='assess'){await call('assessJob',{id});await reload();showJob(id);return;}
    if(action==='analyze-cv'){await call('saveProfile',profilePayload());await call('analyzeCv');delete state.drafts['profile-form'];await reload();toast('CV analyzed. Review the extracted skills and experience.');return;}
    if(action==='digest'){const r=await call('sendDigest');toast(`Briefing sent to your account with ${r.matches} opportunities.`);await reload();return;}
    if(action==='sync-replies'){const r=await call('syncReplies');await reload();toast(`${r.updated} applications updated. ${r.errors.join(' ')} ${r.note}`,!!r.errors.length);return;}
    if(action==='complete-reminder'){await call('completeReminder',{id});await reload();return;}
    if(action==='test-ai'){const r=await call('validateIntegrations');toast(`${r.provider} connection verified. ${r.remainingMailQuota} email recipients remaining today.`);return;}
    if(action==='discover'){const p=settingsPayload();await call('saveSettings',p);if($('#settings-form'))$('#settings-form').elements.geminiKey.value='';state.data.settings=p.settings;const r=await call('discoverSources');$('#discovery-results').innerHTML=r.sources.map(s=>`<div class="discovery"><h3>${esc(s.company)} · ${s.activeJobs} active board postings</h3><p>${esc(s.reason)}</p><button type="button" class="btn small" data-action="add-discovered" data-type="${attr(s.type)}" data-board="${attr(s.board)}" data-company="${attr(s.company)}">Add board</button></div>`).join('')+`<p class="note">${esc(r.note)} ${esc(r.errors.join(' '))}</p>`;return;}
    if(action==='send-application'){const f=$('#application-form');if(!f.elements.approved.checked)throw new Error('Tick the approval box after reviewing your packet.');await call('saveApplication',appPayload());const r=await call('sendApplication',{id,approved:true});await reload();showApplication(id);toast(r.note);return;}
  });
});
document.addEventListener('input',event=>{if(event.target.id==='job-search'){state.search=event.target.value;$('#job-results').innerHTML=jobResults();}});
document.addEventListener('change',async event=>{
  if(event.target.id!=='cv-file'||!event.target.files[0]||state.busy)return;
  const file=event.target.files[0];if(file.size>5*1024*1024){toast('Please upload a CV smaller than 5 MB.',true);return;}
  await work('Extracting your CV text…',async()=>{
    const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file);});
    await call('uploadCv',{name:file.name,mimeType:file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'text/plain'),base64});delete state.drafts['profile-form'];await reload();toast('CV imported. Review the extracted text, then analyze it.');
  });
});
document.addEventListener('submit',async event=>{
  const f=event.target;if(!['profile-form','settings-form','application-form','status-form','outreach-form','send-outreach-form','followup-form','reminder-form'].includes(f.id))return;
  event.preventDefault();if(state.busy)return;
  await work('Saving your next step…',async()=>{
    if(f.id==='profile-form'){await call('saveProfile',profilePayload());delete state.drafts['profile-form'];await reload();toast('Profile saved. Analyze your CV to extract skills.');}
    if(f.id==='settings-form'){const p=settingsPayload();try{await call('saveSettings',p);}finally{f.elements.geminiKey.value='';}delete state.drafts['settings-form'];await reload();toast('Preferences saved. Daily briefing settings updated.');}
    if(f.id==='application-form'){await call('saveApplication',appPayload());await reload();showApplication(f.dataset.id);toast('Application packet saved.');}
    if(f.id==='status-form'){if(!f.elements.approved.checked)throw new Error('Confirm the stage actually happened.');await call('markApplication',{id:f.dataset.id,status:f.elements.status.value,proof:f.elements.proof.value,approved:true});await reload();showApplication(f.dataset.id);toast('Confirmed stage recorded.');}
    if(f.id==='outreach-form'){await call('prepareOutreach',{id:f.dataset.id,channel:f.elements.channel.value,contactName:f.elements.contactName.value,recipient:f.elements.recipient.value,profileUrl:f.elements.profileUrl.value,context:f.elements.context.value,affiliationSource:f.elements.affiliationSource.value,affiliationConfirmed:f.elements.affiliationConfirmed.checked});await reload();showApplication(f.dataset.id);toast('Outreach drafted. Review it before sending.');}
    if(f.id==='send-outreach-form'){if(!f.elements.approved.checked)throw new Error('Review and tick the approval box first.');await call('sendOutreach',{id:f.dataset.id,draftId:f.dataset.draftId,subject:f.elements.subject.value,body:f.elements.body.value,recipient:f.elements.recipient.value,recipientConfirmed:f.elements.recipientConfirmed.checked,approved:true});await reload();showApplication(f.dataset.id);toast('Approved outreach sent.');}
    if(f.id==='followup-form'){if(!f.elements.approved.checked)throw new Error('Review and tick the approval box first.');await call('sendFollowUp',{id:f.dataset.id,subject:f.elements.subject.value,body:f.elements.body.value,recipient:f.elements.recipient.value,recipientConfirmed:f.elements.recipientConfirmed.checked,confirmedNoReply:f.elements.confirmedNoReply.checked,approved:true});await reload();showApplication(f.dataset.id);toast('Approved follow-up sent.');}
    if(f.id==='reminder-form'){await call('addReminder',{title:f.elements.title.value,dueAt:new Date(f.elements.dueAt.value).toISOString()});$('#detail-dialog').close();await reload();toast('Reminder added.');}
  });
});
reload().catch(error=>{ $('#main').setAttribute('aria-busy','false');$('#main').innerHTML=heading('Your private workspace','The dashboard could not connect to its backend.')+`<div class="banner">${esc(error.message)}</div><button class="btn primary" data-action="refresh">Try again</button>`;});
function clearSession(){state.sessionToken='';try{sessionStorage.removeItem('job-helper-session');}catch{}state.data=null;state.drafts={};state.appDrafts={};state.selectedApp=null;$('#detail-dialog').close();$('#dialog-content').innerHTML='';$('#account-name').textContent='';$('#avatar').textContent='';}
function showLogin(email=''){
  $('.sidebar').style.display='none';$('#session-actions').innerHTML='';$('#connection').textContent='Sign in';$('#page-title').textContent='Welcome';
  $('#main').innerHTML=heading('Your next opportunity starts here.','Sign in with the email address invited by the hosting account.')+`<section class="panel"><form id="login-email-form">${field('email','Your invited email',email,'email')}<button class="btn primary" type="submit">Email me a sign-in code</button></form>${email?`<hr class="form-divider"><p class="note">If this address has access, a code will arrive. It expires in 10 minutes.</p><form id="login-code-form" data-email="${attr(email)}"><label class="field"><span>Six-digit sign-in code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn primary" type="submit">Sign in</button></form>`:''}<p class="note">Your CV and applications are visible only through your own login. The hosting Google account stores the data and sends emails. Each application and message needs your approval.</p></section>`;
}
async function accountsDialog(){
  const data=await call('manageUsers',{operation:'list'});
  showDialog(dialogHead('Site access','Invite users by email. Each user sees only their own records and approves their own messages.')+`<form id="shared-config-form">${check('enabled','Enable invitation-based site sign-in',data.enabled)}${check('externalEmail','Allow invited users to send individually approved employer emails',data.config.externalEmail)}${check('confirmedTestReceipt','I received and reviewed the host test briefing',false)}${check('ai','Allow invited users to use the shared AI connection with their own consent',data.config.ai)}${field('mailLimit','Maximum employer messages per user/day',data.config.mailLimit,'number')}<button class="btn" type="submit">Save access settings</button></form><p class="note">The Google web deployment remains private until its access setting is updated. Enable users only after testing sign-in and isolation. All messages use the hosting account and share its quota.</p><hr class="form-divider"><form id="invite-user-form">${field('email','Invite an email address','','email')}<button class="btn primary" type="submit">Grant site access</button></form><p class="note">Inviting does not send a message. Give the user your site URL; they request their own sign-in code.</p>${data.users.map(u=>`<div class="job-row"><div>${esc(u.email)} · ${u.enabled?'Enabled':'Disabled'}</div>${u.id!=='owner'&&u.enabled?`<button class="btn small" data-action="disable-user" data-id="${attr(u.id)}">Disable access</button>`:''}</div>`).join('')}`);
}
document.addEventListener('submit',async event=>{
  const f=event.target;if(!['login-email-form','login-code-form','shared-config-form','invite-user-form'].includes(f.id))return;
  event.preventDefault();await work('Updating your access…',async()=>{
    if(f.id==='login-email-form'){const email=f.elements.email.value;await call('requestLoginCode',{email});showLogin(email);toast('Check your inbox for a sign-in code.');}
    if(f.id==='login-code-form'){const result=await call('verifyLoginCode',{email:f.dataset.email,code:f.elements.code.value});state.sessionToken=result.sessionToken;try{sessionStorage.setItem('job-helper-session',state.sessionToken);}catch{}state.page='overview';await reload();}
    if(f.id==='invite-user-form'){await call('manageUsers',{operation:'invite',email:f.elements.email.value});await accountsDialog();toast('Site access granted. Share the site URL with this user.');}
    if(f.id==='shared-config-form'){await call('manageUsers',{operation:'configure',enabled:f.elements.enabled.checked,externalEmail:f.elements.externalEmail.checked,confirmedTestReceipt:f.elements.confirmedTestReceipt.checked,ai:f.elements.ai.checked,mailLimit:f.elements.mailLimit.value});await reload();await accountsDialog();toast('Access settings saved.');}
  });
});
document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
  if(!['accounts','disable-user','logout','download-document'].includes(action))return;
  await work('Updating your workspace…',async()=>{
    if(action==='accounts')await accountsDialog();
    if(action==='disable-user'){await call('manageUsers',{operation:'disable',id:button.dataset.id});await accountsDialog();toast('Access disabled; existing sessions are revoked.');}
    if(action==='logout'){try{await call('logout');}finally{clearSession();showLogin();}}
    if(action==='download-document'){const file=await call('downloadDocument',{id:button.dataset.id});const bytes=Uint8Array.from(atob(file.base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:file.mimeType}));const a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
  });
});

</script>
